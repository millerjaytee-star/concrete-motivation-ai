name: Web CI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "config/canonical-product.json"
      - "scripts/verify_canonical_product.py"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "config/canonical-product.json"
      - "scripts/verify_canonical_product.py"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/web/.nvmrc

      - name: Verify canonical product metadata
        working-directory: .
        run: python3 scripts/verify_canonical_product.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Production build
        run: npm run build
